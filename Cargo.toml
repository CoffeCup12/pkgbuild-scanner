[package]
name = "pkgbuild-scanner"
version = "0.1.0"
edition = "2024"

[dependencies]
aur-fetch = "0.11.3"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
tokio = { version = "1", features = ["full"] }
flate2 = "1"
tar = "0.4"
tempfile = "3"
chrono = { version = "0.4", features = ["serde"] }

[features]
integration = []

[dev-dependencies]
wiremock = "0.6"
